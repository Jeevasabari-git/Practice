name: sonar run
on: 
  pull_request:
      branches: 
        - main

jobs:
  sonarqube:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - name : chekout code
        uses: actions/checkout@v4

      - name : sonar run
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: >
            -Dsonar.projectKey=assignment-4
            -Dsonar.sources=.
            -Dsonar.host.${{ secrets.SONAR_HOST_URL }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

     push:
     if : github.event_name == 'push' 
    runs-on: self_hosted
    enviornment:
        -name:approval

 
          
   
